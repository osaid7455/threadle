<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadle challenge</title>
<meta name="robots" content="noindex">
<meta property="og:title" content="You've been challenged on Threadle">
<meta property="og:description" content="Same puzzle, beat their time. One thread, every cell, in order.">
<meta property="og:image" content="https://osaid7455.github.io/threadle/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="../img/icon.png">
<style>
  body { margin:0; background:#F6F3EC; color:#1F1B2D; font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; line-height:1.5; }
  .ribbon { height:8px; background:linear-gradient(90deg,#4F7BFF,#8B5CF6,#EC4899,#F97316,#FACC15,#34D399); }
  main { max-width:520px; margin:0 auto; padding:48px 22px 80px; text-align:center; }
  img.icon { width:96px; height:96px; border-radius:24px; box-shadow:0 10px 30px rgba(31,27,45,.18); }
  h1 { font-size:30px; margin:18px 0 6px; letter-spacing:-.5px; }
  p { color:#6E6A7C; margin:0 0 10px; }
  .what { background:#fff; border-radius:18px; padding:16px 18px; margin:22px 0; font-size:18px; }
  .what b { display:block; font-size:22px; color:#1F1B2D; }
  a.cta { display:block; background:#1F1B2D; color:#fff; text-decoration:none; font-weight:700; padding:15px 22px; border-radius:16px; margin:10px 0; }
  a.cta.soft { background:#5B6CFF; }
  .small { font-size:13px; }
</style>
</head>
<body>
<div class="ribbon"></div>
<main>
  <img class="icon" src="../img/icon.png" alt="Threadle">
  <h1>You've been challenged</h1>
  <p>Same puzzle. Beat their time.</p>
  <div class="what" id="what"><b>Loading…</b></div>
  <a class="cta" id="open" href="#">Open in Threadle</a>
  <a class="cta soft" href="https://apps.apple.com/app/id6809221454">Get Threadle on the App Store</a>
  <p class="small">Already have the app? Tap "Open in Threadle". If nothing happens, install it first, then come back to this link.</p>
</main>
<script>
(function () {
  var code = (location.hash || '').replace(/^#\/?/, '').replace(/[^A-Za-z0-9]/g, '');
  var deep = 'threadle://c/' + code;
  document.getElementById('open').href = deep;
  var what = document.getElementById('what');
  var m = /^([LDBR])(\d+)(?:s(\d+))?t(\d+)$/.exec(code);
  if (m) {
    var kind = m[1], n = parseInt(m[2], 10), ms = parseInt(m[4], 10);
    var label = kind === 'L' ? 'Level ' + n
              : kind === 'D' ? 'Daily #' + (n - 20701)
              : kind === 'B' ? 'Big Thread'
              : m[3] + '×' + m[3] + ' challenge';
    var s = Math.floor(ms / 1000), t = Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
    what.innerHTML = '<b>' + label + '</b>Their time: ' + t;
  } else {
    what.innerHTML = '<b>Threadle</b>This link is missing its code. Ask your friend to send it again.';
  }
  // Try the app first; the store button stays for everyone else.
  if (m && /iPhone|iPad|iPod/.test(navigator.userAgent)) {
    setTimeout(function () { location.href = deep; }, 400);
  }
})();
</script>
</body>
</html>
